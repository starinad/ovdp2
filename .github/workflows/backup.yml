name: Supabase Database Backup

on:
  schedule:
    # Every day at 01:00 UTC
    - cron: "0 1 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Create backup directory
        run: |
          mkdir -p backup

      - name: Backup roles
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backup/roles.sql \
            --role-only

      - name: Backup schema
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backup/schema.sql

      - name: Backup data
        run: |
          supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f backup/data.sql \
            --data-only \
            --use-copy

      - name: Show backup size
        run: |
          du -h backup/*
          du -sh backup

      - name: Compress backup
        run: |
          DATE=$(date -u +"%Y-%m-%d_%H-%M-%S")
          BACKUP_FILE="supabase-backup-${DATE}.tar.gz"

          tar -czf "$BACKUP_FILE" backup/

          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"

          echo "Backup created:"
          ls -lh "$BACKUP_FILE"

      - name: Upload backup to Backblaze B2
        uses: backblaze-labs/b2-action@v1
        with:
          action: upload
          application-key-id: ${{ secrets.B2_KEY_ID }}
          application-key: ${{ secrets.B2_APPLICATION_KEY }}
          bucket: ${{ secrets.B2_BUCKET }}
          source: ./${{ env.BACKUP_FILE }}
          destination: postgres/${{ env.BACKUP_FILE }}
          content-type: application/gzip

      - name: Backup completed
        run: |
          echo "Backup uploaded successfully:"
          echo "postgres/${BACKUP_FILE}"