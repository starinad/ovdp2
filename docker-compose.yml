services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ovdp
      POSTGRES_USER: ovdp
      POSTGRES_PASSWORD: ovdp
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovdp -d ovdp"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - ovdp-postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  ovdp-postgres:
