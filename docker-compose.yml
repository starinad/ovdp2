services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ovdp
      POSTGRES_USER: ovdp
      POSTGRES_PASSWORD: ovdp
    ports:
      - "5432:5432"
    volumes:
      - ovdp-postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  ovdp-postgres:
